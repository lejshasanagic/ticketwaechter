name: Ticketwaechter

on:
  schedule:
    - cron: "3-59/5 * * * *"  # alle 5 Minuten, versetzt zur vollen Stunde (dann ist GitHub überlastet)
  workflow_dispatch:       # Knopf "Run workflow" zum manuellen Testen

permissions:
  contents: write  # damit zustand.json gespeichert werden kann

concurrency:
  group: waechter

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Seiten pruefen
        run: python3 waechter.py
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          BHFF_USER: ${{ secrets.BHFF_USER }}
          BHFF_PASSWORD: ${{ secrets.BHFF_PASSWORD }}
          BHFF_SEITE: ${{ secrets.BHFF_SEITE }}

      - name: Zustand speichern
        run: |
          git config user.name "Ticketwaechter"
          git config user.email "actions@github.com"
          git add zustand.json
          git diff --cached --quiet || (git commit -m "Zustand aktualisiert" && git push)
